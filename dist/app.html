<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214e48"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MeComunico"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>MeComunico · Mi espacio</title><style>
:root{--ink:#203d39;--green:#214e48;--mint:#e4efe6;--bg:#faf8f2;--orange:#f3c780}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:18px;padding:16px;background:var(--green);color:white;min-height:52px}button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #ce7627;outline-offset:3px}button.secondary{background:var(--mint);color:var(--ink)}header{max-width:1160px;margin:auto;padding:26px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:24px;letter-spacing:-1px}.brand span{background:var(--green);color:white;border-radius:13px;padding:8px 12px;margin-right:9px}main{max-width:1100px;margin:auto;padding:15px 24px 130px}h1{font-size:clamp(32px,5vw,52px);letter-spacing:-2px;margin:12px 0}h2{font-size:27px}p{line-height:1.6}.eyebrow{text-transform:uppercase;font-size:13px;letter-spacing:2px;font-weight:700}.hero{background:var(--mint);padding:32px;border-radius:30px;display:flex;justify-content:space-between;gap:25px;align-items:center}.hero-art{font-size:95px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:24px 0}.card{text-align:left;color:var(--ink);background:white;border:1px solid #e2e5da;padding:26px;box-shadow:0 5px 16px #203d3905;transition:transform .15s}.card:hover{transform:translateY(-3px)}.card .emoji{font-size:43px;display:block;margin-bottom:17px}.card strong{display:block;font-size:23px}.card small{display:block;margin-top:9px;line-height:1.5;font-size:16px;font-weight:400}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.panel{background:white;border-radius:24px;border:1px solid #e2e5da;padding:26px;margin:22px 0}.message{min-height:85px;background:#fff5dc;border-radius:18px;padding:20px;font-size:26px;margin:20px 0}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:var(--mint);color:var(--ink);font-size:20px}.tile span{display:block;font-size:34px;margin-bottom:8px}.hint{font-size:15px;color:#526861}.nav{position:fixed;bottom:0;left:0;right:0;background:#faf8f2f5;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:center;gap:10px;z-index:5}.nav button{font-size:16px;padding:12px 18px}.row{display:flex;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.row .symbol{font-size:30px}.row button{margin-left:auto}.done{opacity:.6;text-decoration:line-through}label{display:block;margin:18px 0 7px;font-weight:650}input,select{padding:13px;border:1px solid #a4b4aa;border-radius:12px;width:100%;background:white;color:var(--ink)}.feedback{min-height:45px;margin:15px 0;font-weight:650}.big{font-size:64px;padding:25px;text-align:center}.badge{border-radius:25px;background:#fff1d5;padding:9px 15px;font-size:14px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:18px}.card strong{font-size:20px}.card small{font-size:14px}.tiles{grid-template-columns:repeat(2,1fr)}.hero{padding:24px}.hero-art{display:none}header{padding:18px}.brand{font-size:21px}main{padding:12px 16px 110px}.nav button{font-size:14px;padding:12px}.panel{padding:19px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Safe areas on iPhone/iPad, split view and tablet landscape. */
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
main{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.nav{padding-bottom:calc(10px + env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
.card,.tile,.grid>button{min-width:0;overflow-wrap:anywhere}button{touch-action:manipulation}.message{overflow-wrap:anywhere}.row>span:not(.symbol){min-width:0;overflow-wrap:anywhere}.row button{flex-shrink:0}
@media(min-width:651px) and (max-width:1024px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-art{font-size:70px}}
@media(max-width:380px){header{flex-wrap:wrap}.grid{grid-template-columns:1fr}.nav{gap:5px}.nav button{padding:10px;font-size:13px}.big{font-size:48px}.row{gap:8px}}

</style></head><body><header><div class="brand"><span>↗</span>MeComunico</div><button class="secondary" id="family">Familia ⚙</button></header><main id="app"></main><nav class="nav" aria-label="Principal"><button id="home">⌂ Inicio</button><button id="communicate">💬 Comunicar</button><button id="routine">☀ Mi día</button></nav><script>
const $=id=>document.getElementById(id),app=$('app');let state={name:'',sound:true,routine:['Desayunar','Asearme','Aprender un poco','Moverme y jugar','Descansar'],custom:[],progress:{},daily:{}};try{Object.assign(state,JSON.parse(localStorage.getItem('paso-v1')||'{}'))}catch{}let phrase=[],question=0,correct=0,mode='',sequence=[],timer=null,installEvent=null;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('paso-v1',JSON.stringify(state))}catch{alert('No se pudo guardar. Revisa el espacio o los permisos del navegador.')}}function say(t){if(!state.sound)return;if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-EC';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}else alert('La voz no está disponible en este navegador.')}function render(html){clearTimeout(timer);app.innerHTML=html;window.scrollTo(0,0)}function title(label,sub){return '<div class="eyebrow">MI ESPACIO · A MI RITMO</div><h1>'+label+'</h1><p>'+sub+'</p>'}function home(){render('<section class="hero"><div><div class="eyebrow">UN PASO CADA VEZ</div><h1>'+ (state.name?'Hola, '+escape(state.name):'Este es tu espacio')+'</h1><p>Elige lo que quieres hacer hoy.<br>Podemos hacerlo juntos.</p><button onclick="comm()">Quiero decir algo →</button></div><div class="hero-art" aria-hidden="true">🌿</div></section><div class="grid">'+[['☀️','Mi día','Mira qué viene después.','routine()'],['🎵','Música y ritmo','Escucha, elige y juega.','music()'],['🔢','Números','Cuenta a tu ritmo.','startQuiz("numbers")'],['🥣','Cocina','Ordena una receta sencilla.','cooking()'],['🐾','Mascotas','Descubre cómo cuidarlas.','startQuiz("pets")'],['💛','Cómo me siento','Cuéntalo con imágenes.','feelings()']].map(x=>'<button class="card" onclick=\''+x[3]+'\'><span class="emoji" aria-hidden="true">'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></button>').join('')+'</div><p class="hint">Para aprender y comunicarnos juntos. Las actividades tienen un final; puedes parar cuando quieras.</p>')}
function comm(){const items=[['🙋','Yo'],['💚','Quiero'],['✋','No quiero'],['💧','Agua'],['🍽️','Comer'],['🛏️','Descansar'],['🆘','Ayúdame'],['🤕','Me duele'],['🌡️','Tengo calor'],['🚻','Ir al baño'],['🎶','Música'],['⚽','Jugar'],['👍','Sí'],['👎','No'],['❤️','Me gusta'],['🛑','Parar'],...state.custom.map(t=>['💬',t])];render(title('Quiero decir algo','Toca una o varias palabras. También puedes hablar o señalar.')+'<div id="phrase" class="message" aria-live="polite">'+escape(phrase.join(' ')||'Tu mensaje aparece aquí')+'</div><div class="bar"><button id="speak">🔊 Decir mensaje</button><button class="secondary" id="undo">Borrar última</button><button class="secondary" id="clear">Limpiar</button></div><div class="tiles panel">'+items.map((x,i)=>'<button class="tile" data-i="'+i+'"><span aria-hidden="true">'+x[0]+'</span>'+escape(x[1])+'</button>').join('')+'</div>');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const t=items[+b.dataset.i][1];phrase.push(t);$('phrase').textContent=phrase.join(' ');say(t)});$('speak').onclick=()=>say(phrase.join(' '));$('undo').onclick=()=>{phrase.pop();$('phrase').textContent=phrase.join(' ')||'Tu mensaje aparece aquí'};$('clear').onclick=()=>{phrase=[];$('phrase').textContent='Tu mensaje aparece aquí'}}
function routine(){const day=new Date().toLocaleDateString('en-CA');if(state.daily.date!==day)state.daily={date:day,done:[]};render(title('Mi día','Una actividad a la vez. Tu familia puede cambiar esta lista.')+'<section class="panel">'+state.routine.map((t,i)=>'<div class="row"><span class="symbol" aria-hidden="true">'+['☀️','🧼','📚','⚽','🌙'][i%5]+'</span><span class="'+(state.daily.done.includes(i)?'done':'')+'">'+escape(t)+'</span><button class="secondary" data-step="'+i+'" aria-pressed="'+state.daily.done.includes(i)+'">'+(state.daily.done.includes(i)?'✓ Hecho':'Marcar')+'</button></div>').join('')+'</section><button onclick="say(state.routine.filter((t,i)=>!state.daily.done.includes(i))[0]||\'Terminaste tu lista\')">🔊 ¿Qué sigue?</button>');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let i=+b.dataset.step;state.daily.done=state.daily.done.includes(i)?state.daily.done.filter(x=>x!==i):[...state.daily.done,i];save();routine()})}
function feelings(){render(title('Cómo me siento','Puedes elegir una opción, cambiarla o decirlo a tu manera.')+'<div class="tiles panel">'+[['🙂','Bien'],['😟','Preocupado'],['😢','Triste'],['😠','Enojado'],['😴','Cansado'],['🤕','Con dolor'],['🤷','No sé'],['🤝','Quiero compañía']].map(x=>'<button class="tile" data-feel="'+x[1]+'"><span>'+x[0]+'</span>'+x[1]+'</button>').join('')+'</div><p id="feeling" class="message" aria-live="polite">¿Cómo te sientes?</p><button onclick="comm()">Decir algo más →</button><p class="hint">Estas opciones ayudan a conversar; no interpretan ni diagnostican emociones.</p>');document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{const t='Me siento: '+b.dataset.feel;$('feeling').textContent=t;say(t)})}
const petQ=[{q:'¿Qué necesita una mascota para beber?',art:'🐕',opts:['Agua','Una pelota','Un zapato'],answer:0},{q:'¿Cómo acariciamos a una mascota que acepta el contacto?',art:'🐈',opts:['Con suavidad','Tirando de su cola','Gritando'],answer:0},{q:'¿Qué hacemos antes de tocar una mascota desconocida?',art:'🐾',opts:['Pedir permiso a su cuidador','Correr hacia ella','Darle cualquier comida'],answer:0}];let options=[];function startQuiz(m){mode=m;question=0;correct=0;quiz()}function quiz(){let q,art,answer;if(mode==='numbers'){answer=question+1;art='🍎'.repeat(answer);q='¿Cuántas manzanas hay?';options=[1,2,3].sort(()=>Math.random()-.5)}else{const p=petQ[question];q=p.q;art=p.art;answer=p.opts[p.answer];options=[...p.opts].sort(()=>Math.random()-.5)}render(title(mode==='numbers'?'Contamos juntos':'Cuidamos mascotas','Actividad '+(question+1)+' de 3 · Puedes parar y volver cuando quieras.')+'<div class="panel"><div class="big" aria-label="'+(mode==='numbers'?'Manzanas para contar':'Mascota')+'">'+art+'</div><h2>'+q+'</h2><button class="secondary" onclick="say('+JSON.stringify(q).replace(/"/g,'&quot;')+')">🔊 Escuchar</button><div class="grid">'+options.map((o,i)=>'<button data-answer="'+i+'">'+escape(o)+'</button>').join('')+'</div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="hidden">Siguiente →</button></div>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(String(options[+b.dataset.answer])===String(answer)){$('feedback').textContent='¡Lo encontraste!';say('Lo encontraste');correct++;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('next').classList.remove('hidden')}else{$('feedback').textContent='Podemos mirar de nuevo. Prueba otra opción.';say('Miremos de nuevo')}});$('next').onclick=()=>{question++;question===3?finish(mode):quiz()}}
function finish(key){state.progress[key]=(state.progress[key]||0)+1;save();render(title('Actividad terminada','Gracias por compartir este momento.')+'<div class="panel"><div class="big">🌱</div><h2>Ahora puedes elegir otra actividad o descansar.</h2><p>Si alguien te ayudó, también está bien.</p><button onclick="home()">Volver al inicio</button></div>')}
function cooking(){sequence=[];cookView()}function cookView(){const steps=[['🧼','Lavarnos las manos'],['🍌','Pelar la banana'],['🥣','Ponerla en el plato']];render(title('Preparamos una banana','Elige los pasos en orden. Practica con un adulto; no necesitas cuchillos.')+'<div class="panel"><p>Pasos elegidos: '+sequence.length+' de 3</p><div class="grid">'+[2,0,1].map(i=>'<button class="tile" data-cook="'+i+'" '+(sequence.includes(i)?'disabled':'')+'><span>'+steps[i][0]+'</span>'+steps[i][1]+'</button>').join('')+'</div><div id="feedback" class="feedback" aria-live="polite"></div>'+sequence.map(i=>'<p>✓ '+steps[i][1]+'</p>').join('')+(sequence.length===3?'<button onclick="finish(\'cooking\')">Terminamos →</button>':'')+'</div>');document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>{let i=+b.dataset.cook;if(i===sequence.length){sequence.push(i);say(steps[i][1]);cookView()}else{$('feedback').textContent='Primero: '+steps[sequence.length][1];say($('feedback').textContent)}})}
function music(){render(title('Música y ritmo','Jugamos con sonidos breves. Tú decides cuándo parar.')+'<div class="panel"><div class="big">🎵</div><h2>Escucha tres notas</h2><p>Después puedes acompañarlas con tres palmadas suaves.</p><button id="notes">▶ Escuchar</button><p id="musicMsg" aria-live="polite"></p><button class="secondary" onclick="finish(\'music\')">Terminar actividad</button></div><p class="hint">Esta primera versión usa notas propias; no reproduce YouTube ni TikTok.</p>');$('notes').onclick=()=>{try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{});[262,330,392].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime+i*.6);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+i*.6+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.6+.45);o.start(ctx.currentTime+i*.6);o.stop(ctx.currentTime+i*.6+.5)});timer=setTimeout(()=>ctx.close(),2200);$('musicMsg').textContent='Puedes hacer tres palmadas o simplemente escuchar.'}catch{$('musicMsg').textContent='El sonido no está disponible aquí.'}}}
function family(){render(title('Espacio de la familia','Personaliza la experiencia. Los datos quedan en este navegador, sin cuenta ni envío a un servidor.')+'<section class="panel"><label for="name">Nombre o apodo (opcional)</label><input id="name" maxlength="40" value="'+escape(state.name)+'"><label for="voice">Voz al tocar palabras</label><select id="voice"><option value="yes">Activada</option><option value="no">Desactivada</option></select><label for="routines">Rutina: una actividad por línea</label><textarea id="routines" rows="5" style="width:100%;font:inherit;padding:13px;border-radius:12px">'+escape(state.routine.join('\n'))+'</textarea><label for="custom">Frases propias: una por línea</label><textarea id="custom" rows="4" style="width:100%;font:inherit;padding:13px;border-radius:12px">'+escape(state.custom.join('\n'))+'</textarea><p><button class="secondary" onclick="activityEditor()">Crear y administrar actividades</button></p><p><button id="save">Guardar cambios</button> <button class="secondary" onclick="say(\'Hola, este es tu espacio\')">Probar voz</button></p><div id="saved" aria-live="polite"></div></section><section class="panel"><h2>Actividades completadas</h2><p>Números: '+(state.progress.numbers||0)+' · Mascotas: '+(state.progress.pets||0)+' · Cocina: '+(state.progress.cooking||0)+' · Música: '+(state.progress.music||0)+'</p><p class="hint">Son conteos de actividades, no una evaluación clínica ni una medida de aprendizaje.</p><button class="secondary" id="export">Descargar respaldo</button><label for="import">Restaurar respaldo JSON</label><input id="import" type="file" accept="application/json"><p id="importMsg" aria-live="polite"></p></section><section class="panel"><h2>Instalar en tu dispositivo</h2><p><strong>iPhone o iPad:</strong> abre esta web en Safari → Compartir → Añadir a pantalla de inicio. Activa «Abrir como app web» si aparece y toca Añadir.</p><p><strong>Android o tablet Android:</strong> en Chrome abre el menú ⋮ → Instalar aplicación o Añadir a pantalla principal.</p><p>También puedes usar la web directamente en tablets y computadoras. La disponibilidad de instalación depende del navegador.</p><button id="install" '+(!installEvent?'class="hidden"':'')+'>Instalar MeComunico</button><p class="hint">Después de la primera carga, las actividades pueden funcionar sin conexión. La voz depende del teléfono. Borrar datos del navegador elimina el progreso: descarga un respaldo.</p><p class="hint">Versión 0.2.0 · Apoyo educativo y de comunicación. No reemplaza la atención médica, terapia o educación adaptada. El acceso familiar es un espacio de configuración, no un bloqueo de seguridad.</p></section>');$('voice').value=state.sound?'yes':'no';$('save').onclick=()=>{state.name=$('name').value.trim();state.sound=$('voice').value==='yes';state.routine=$('routines').value.split('\n').map(x=>x.trim().slice(0,100)).filter(Boolean).slice(0,20);state.custom=$('custom').value.split('\n').map(x=>x.trim().slice(0,100)).filter(Boolean).slice(0,30);save();$('saved').textContent='Cambios guardados.'};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='mecomunico-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(typeof d.name!=='string'||typeof d.sound!=='boolean'||!Array.isArray(d.routine)||!Array.isArray(d.custom)||!d.routine.every(x=>typeof x==='string')||!d.custom.every(x=>typeof x==='string'))throw Error();state.name=d.name.slice(0,40);state.sound=d.sound;state.routine=d.routine.slice(0,20).map(x=>x.slice(0,100));state.custom=d.custom.slice(0,30).map(x=>x.slice(0,100));state.progress=Object.fromEntries(['numbers','pets','cooking','music'].map(k=>[k,Math.max(0,Number(d.progress?.[k])||0)]));state.activities=validateActivities(d.activities||[]);state.daily={};save();family();$('importMsg').textContent='Respaldo restaurado.'}catch{$('importMsg').textContent='No se pudo leer el respaldo. Selecciona un archivo exportado desde esta app.'}};$('install').onclick=async()=>{if(installEvent){await installEvent.prompt();installEvent=null;$('install').classList.add('hidden')}}}
$('home').onclick=home;$('communicate').onclick=comm;$('routine').onclick=routine;$('family').onclick=family;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});home();
</script><script src="activities.js"></script></body></html>
